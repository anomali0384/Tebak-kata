    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        .screen { width: 100%; height: 100dvh; display: none; flex-direction: column; align-items: center; box-sizing: border-box; }
        
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; justify-content: center; align-items: center; 
            background-color: #121212; z-index: 999; opacity: 1;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        #loading-screen.fade-out { opacity: 0; visibility: hidden; }

        .loading-logo { width: 220px; height: auto; animation: pulse 1.5s infinite alternate; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        #main-menu { font-size: 70%; display: flex; background-color: #555555; justify-content: flex-start; padding-top: 40px; }
        .logo-img { width: 70px; height: auto; margin-bottom: 15px; border-radius: 15px; }

        .menu-btn { padding: 15px 30px; margin: 10px; font-size: 18px; cursor: pointer; background: #333; color: white; border: none; border-radius: 8px; width: 250px; -webkit-tap-highlight-color: transparent; }
        .menu-btn:hover { background: #444; }
        .menu-buttons { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }

        #header { width: 100%; max-width: 400px; display: grid; grid-template-columns: 80px 1fr 80px; align-items: start; margin-top: 15px; padding: 0 10px; box-sizing: border-box; }
        #controls-left { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
        #header-center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #controls-right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
        
        #btn-menu, #btn-settings { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; -webkit-tap-highlight-color: transparent; }
        #btn-surrender { background-color: #ff4444; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; visibility: hidden; -webkit-tap-highlight-color: transparent; }
        #attempts { font-size: 14px; text-align: right; }
        #header h3 { text-align: center; margin: 0; font-size: 75%; font-weight: 500; letter-spacing: 1px; }

        #streak-display { font-size: 9px; font-weight: bold; color: white; margin-top: 12px; }

        #board-area { flex: 0 0 auto; height: 430px; display: flex; justify-content: center; align-items: center; overflow-x: auto; max-width: 100%; padding: 0 10px; box-sizing: border-box; }
        
        #controls-area { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 0px; width: 100%; box-sizing: border-box; justify-content: flex-end; position: relative; }
        
        #status-msg { font-size: 14px; height: 25px; text-align: center; position: absolute; bottom: 175px; width: 100%; z-index: 10; }
        
        #btn-new-game { background: white; color: black; border: none; padding: 8px 16px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-bottom: 120px; z-index: 10; -webkit-tap-highlight-color: transparent; }
        .hidden-btn { display: none !important; }
        
        .grid { display: grid; grid-template-rows: repeat(8, 36px); gap: 6px; }
        .row { display: grid; gap: 4px; transition: transform 0.1s; }
        .box { 
            width: 36px; height: 36px; border: 2px solid #333; 
            display: flex; align-items: center; justify-content: center; 
            font-family: 'Arial Black', sans-serif; font-weight: 900; font-size: 18px; 
            text-transform: uppercase; border-radius: 4px; box-sizing: border-box;
            cursor: pointer;
        }
        .box.active-box {
            border-color: #9ca3af;
        }
        .row.hidden-row { visibility: hidden; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s; }

        .keyboard { 
            display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 410px; 
            padding: 5px 8px 12px 8px; box-sizing: border-box; position: absolute; bottom: 0; 
            background-color: transparent; z-index: 5; 
        }
        .key-row { display: flex; justify-content: center; gap: 5px; }
        
        button.key { 
            padding: 14px 4px; background: #6b7280; color: #ffffff; 
            border: none; border-radius: 6px; flex: 1; font-weight: 800; font-size: 13px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 0 #4b5563, 0 4px 6px rgba(0,0,0,0.25); 
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }
        button.key:focus {
            outline: none;
        }
        button.wide { flex: 1.6; background: #9ca3af; font-size: 11px; color: #1f2937; box-shadow: 0 4px 0 #6b7280, 0 4px 6px rgba(0,0,0,0.25); }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: #1e1e1e; border: 1px solid #333; padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; }
        .modal-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn-modal { background: rgba(255,255,255,0.75); color: black; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; font-size: 14px; cursor: pointer; flex: 1; -webkit-tap-highlight-color: transparent; }
        .settings-title { font-size: 14px; color: #aaa; margin: 15px 0 8px 0; font-weight: bold; text-align: left; }
        .settings-btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center; -webkit-tap-highlight-color: transparent; }
        .settings-btn.active { background: #444; border-color: #666; font-weight: bold; }
        .num-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 15px; }
        .num-btn { flex: 1; padding: 8px 0; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .num-btn.active { background: #444; border-color: #666; }
        .btn-close-settings { margin-top: 10px; background: white; color: black; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; -webkit-tap-highlight-color: transparent; }
    </style>

<body>

<div id="loading-screen">
    <img src="https://i.ibb.co.com/4RjtcjvD/1000034154.png" alt="Loading Logo" class="loading-logo">
</div>

<div id="main-menu" class="screen">
    <img src="https://i.ibb.co.com/4RjtcjvD/1000034154.png" alt="Logo Tebak Kata" class="logo-img">
    
    <h1>TEBAK KATA</h1>
    <div class="menu-buttons">
        <button class="menu-btn" onclick="showGame('katla')">kata klasik</button>
        <button class="menu-btn" onclick="alert('Coming soon!')">belum ada</button>
    </div>
</div>

<div id="game-katla" class="screen">
    <div id="header">
        <div id="controls-left">
            <button id="btn-menu" onclick="goBackToMenu()">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
            </button>
            <button id="btn-surrender" onclick="toggleModal(true)">Menyerah</button>
        </div>
        
        <div id="header-center">
            <h3>KATA KLASIK</h3>
            <div id="streak-display">❤‍🔥0</div>
        </div>
        
        <div id="controls-right">
            <button id="btn-settings" onclick="toggleSettings(true)">
                <svg viewBox="0 0 24 24" width="30" height="30" fill="white">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <div id="attempts">Sisa: 8</div>
        </div>
    </div>
    
    <div id="board-area"><div class="grid" id="board"></div></div>
    
    <div id="controls-area">
        <div id="status-msg"></div>
        <button id="btn-new-game" class="hidden-btn" onclick="resetGame()">Mulai Baru</button>
        <div class="keyboard" id="keyboard"></div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay">
    <div class="modal-box">
        <p>Apakah anda yakin ingin menyerah?</p>
        <div class="modal-buttons">
            <button class="btn-modal" onclick="toggleModal(false)">Tidak</button>
            <button class="btn-modal" onclick="confirmSurrender()">Oke</button>
        </div>
    </div>
</div>

<div id="settings-overlay" class="modal-overlay">
    <div class="modal-box" style="text-align: left;">
        <div class="settings-title">Pilih Bahasa</div>
        <button class="settings-btn active" id="lang-id" onclick="changeLanguage('id')">Indonesia</button>
        <button class="settings-btn" id="lang-en" onclick="changeLanguage('en')">Inggris</button>
        <div style="margin-top: 20px;"></div>
        <div class="settings-title">Pilih Jumlah Huruf</div>
        <div class="num-row">
            <button class="num-btn active" onclick="changeLength(this, 5)">5</button>
            <button class="num-btn" onclick="changeLength(this, 6)">6</button>
            <button class="num-btn" onclick="changeLength(this, 7)">7</button>
            <button class="num-btn" onclick="changeLength(this, 8)">8</button>
            <button class="num-btn" onclick="changeLength(this, 9)">9</button>
        </div>
        <button class="btn-close-settings" onclick="toggleSettings(false)">Tutup</button>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 800);
        }, 1500);

        loadStreak();
        history.replaceState({ screen: 'menu' }, '');
    });

    window.addEventListener('popstate', (event) => {
        const settingsOverlay = document.getElementById('settings-overlay');
        const modalOverlay = document.getElementById('modal-overlay');

        if (modalOverlay.style.display === 'flex') {
            toggleModal(false);
            history.pushState({ screen: 'game' }, '');
        } else if (settingsOverlay.style.display === 'flex') {
            toggleSettings(false);
            history.pushState({ screen: 'game' }, '');
        } else if (document.getElementById('game-katla').style.display === 'flex') {
            goBackToMenu();
        } else {
            history.replaceState({ screen: 'menu' }, '');
        }
    });

    const dictionaryMap = {
        5: ["ABADI", "ACARA", "AKTIF", "AKSES", "AMBIL", "ANTAR", "BADAI", "BADAN", "BAHAN", "BATIK", "BEBAS", "BEKAL", "BENAR", "BENDA", "BENIH", "BERAT", "BESAR", "BESOK", "BETON", "BIASA", "BIBIR", "BIDAN"],
        6: ["ALAMAT", "BANDAR", "CANTIK", "CERITA", "DEMPET", "GOMBAL", "GAMBAR", "KELADI", "KORBAN", "MENTAL", "BONEKA", "SENANG"],
        7: ["BAHAGIA", "BANTUAN", "EKONOMI", "GAMELAN", "KELUARGA", "KOLONEL", "MASALAH", "SEKOLAH"],
        8: ["KELENJAR", "KOMPUTER", "OLAHRAGA", "DEKORASI", "RENOVASI"],
        9: ["ASTRONOMI", "DEMOKRASI", "KABUPATEN", "BIMASAKTI", "TEKNOLOGI"]
    };

    let wordLength = 5;
    let gameState = {}; // Menyimpan state per panjang kata agar tidak tereset saat ganti jumlah huruf
    let streak = 0; 
    let keyStates = {};
    
    const board = document.getElementById('board');
    const statusMsg = document.getElementById('status-msg');
    const btnNewGame = document.getElementById('btn-new-game');
    const btnSurrender = document.getElementById('btn-surrender');
    const modal = document.getElementById('modal-overlay');
    const keyboard = document.getElementById('keyboard');
    const streakDisplay = document.getElementById('streak-display');

    function loadStreak() {
        const savedStreak = localStorage.getItem('katla_streak_' + wordLength);
        streak = savedStreak !== null ? parseInt(savedStreak, 10) : 0;
        updateStreakDisplay();
    }

    function saveStreak() {
        localStorage.setItem('katla_streak_' + wordLength, streak);
    }

    function updateStreakDisplay() {
        streakDisplay.innerText = "❤‍🔥" + streak;
    }

    function showGame(game) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-katla').style.display = 'flex';
        history.pushState({ screen: 'game' }, '');
        if (!gameState[wordLength]) { initGameData(); }
        else { restoreGameData(); }
    }
    
    function goBackToMenu() {
        document.getElementById('game-katla').style.display = 'none';
        document.getElementById('main-menu').style.display = 'flex';
        history.replaceState({ screen: 'menu' }, '');
    }

    function toggleSettings(show) { 
        document.getElementById('settings-overlay').style.display = show ? 'flex' : 'none'; 
        if (show) history.pushState({ screen: 'settings' }, '');
    }

    function changeLanguage(lang) {
        document.getElementById('lang-id').classList.remove('active');
        document.getElementById('lang-en').classList.remove('active');
        document.getElementById('lang-' + lang).classList.add('active');
    }

    function changeLength(element, length) {
        const buttons = document.querySelectorAll('.num-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        wordLength = length;
        loadStreak();
        
        if (!gameState[wordLength]) {
            initGameData();
        } else {
            restoreGameData();
        }
    }

    function initGameData() {
        const currentDict = dictionaryMap[wordLength] || dictionaryMap[5];
        gameState[wordLength] = {
            secretWord: currentDict[Math.floor(Math.random() * currentDict.length)],
            attempts: 8,
            currentRow: 0,
            currentInput: "",
            activeBoxIndex: 0,
            gameOver: false,
            guesses: [], // Menyimpan riwayat tebakan per baris
            keyStates: {}
        };
        restoreGameData();
    }

    function restoreGameData() {
        const state = gameState[wordLength];
        document.getElementById('attempts').innerText = "Sisa: " + state.attempts;
        statusMsg.innerText = ""; statusMsg.style.color = "white";
        board.innerHTML = "";
        
        if (state.gameOver) {
            btnNewGame.classList.remove('hidden-btn');
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else {
            btnNewGame.classList.add('hidden-btn');
            btnSurrender.style.visibility = state.currentRow > 0 ? 'visible' : 'hidden';
            keyboard.style.display = 'flex';
        }
        
        keyStates = state.keyStates;
        updateStreakDisplay();
        renderKeyboard();
        
        for (let i = 0; i < 8; i++) {
            const row = document.createElement('div');
            row.className = 'row' + (i <= state.currentRow && (!state.gameOver || i < state.attempts || state.guesses[i]) ? '' : (i === state.currentRow ? '' : ' hidden-row'));
            // Jika baris sudah lewat atau belum terbuka tapi sesuai logika
            if (i > state.currentRow && i !== state.currentRow) {
                row.className = 'row hidden-row';
            }
            row.id = 'row-' + i;
            row.style.gridTemplateColumns = `repeat(${wordLength}, 36px)`;
            
            for (let j = 0; j < wordLength; j++) {
                const box = document.createElement('div');
                box.className = 'box';
                const boxIndex = j;
                box.onclick = () => {
                    if (state.gameOver || i !== state.currentRow) return;
                    state.activeBoxIndex = boxIndex;
                    updateBoard();
                };
                row.appendChild(box);
            }
            board.appendChild(row);
        }

        // Render ulang tebakan yang sudah masuk sebelumnya
        for (let i = 0; i < state.guesses.length; i++) {
            if (state.guesses[i]) {
                applyGuessVisuals(i, state.guesses[i]);
            }
        }
        updateBoard();
        updateKeyboardColors();
    }

    function toggleModal(show) { 
        modal.style.display = show ? 'flex' : 'none'; 
        if (show) history.pushState({ screen: 'modal' }, '');
    }

    function confirmSurrender() {
        toggleModal(false);
        const state = gameState[wordLength];
        statusMsg.innerHTML = `MENYERAH - Kata: <span style="color:white">${state.secretWord}</span>`;
        statusMsg.style.color = "#ff4444";
        streak = 0; 
        saveStreak();
        updateStreakDisplay(); 
        state.gameOver = true;
        btnNewGame.classList.remove('hidden-btn');
        btnSurrender.style.visibility = 'hidden';
        keyboard.style.display = 'none';
    }

    function resetGame() { 
        gameState[wordLength] = null;
        initGameData(); 
    }

    function handleInput(key) {
        const state = gameState[wordLength];
        if (state.gameOver) return;
        
        let inputArray = state.currentInput.padEnd(wordLength, ' ').split('');

        if (key === "ENTER") {
            if (state.currentInput.trim().length === wordLength && state.currentInput.length === wordLength) {
                checkWord();
            } else {
                statusMsg.innerText = `Harus ${wordLength} huruf!`;
            }
        } else if (key === "DEL") {
            if (inputArray[state.activeBoxIndex] !== ' ') {
                inputArray[state.activeBoxIndex] = ' ';
            } else if (state.activeBoxIndex > 0) {
                state.activeBoxIndex--;
                inputArray[state.activeBoxIndex] = ' ';
            }
            state.currentInput = inputArray.join('').trimEnd();
            statusMsg.innerText = "";
            updateBoard();
        } else {
            inputArray[state.activeBoxIndex] = key;
            state.currentInput = inputArray.join('').replace(/\s+$/, '');
            if (state.activeBoxIndex < wordLength - 1) {
                state.activeBoxIndex++;
            }
            statusMsg.innerText = "";
            updateBoard();
        }
    }

    function updateBoard() {
        const state = gameState[wordLength];
        const rowEl = document.getElementById('row-' + state.currentRow);
        if (!rowEl) return;
        const boxes = rowEl.querySelectorAll('.box');
        
        for (let i = 0; i < wordLength; i++) {
            boxes[i].innerText = state.currentInput[i] || "";
            if (i === state.activeBoxIndex && !state.gameOver) {
                boxes[i].classList.add('active-box');
            } else {
                boxes[i].classList.remove('active-box');
            }
        }
    }

    function applyGuessVisuals(rowIndex, guessWord) {
        const state = gameState[wordLength];
        const rowEl = document.getElementById('row-' + rowIndex);
        if (!rowEl) return;
        const boxes = rowEl.querySelectorAll('.box');
        let tempSecret = state.secretWord.split('');
        let guessResult = Array(wordLength).fill('gray');
        
        for(let i=0; i<wordLength; i++) {
            boxes[i].innerText = guessWord[i];
            if(guessWord[i] === state.secretWord[i]) {
                boxes[i].style.backgroundColor = "#538d4e";
                boxes[i].style.borderColor = "#538d4e";
                tempSecret[i] = null;
                guessResult[i] = 'green';
            }
        }
        for(let i=0; i<wordLength; i++) {
            if(guessResult[i] !== 'green') {
                if(tempSecret.includes(guessWord[i])) {
                    boxes[i].style.backgroundColor = "#b59f3b";
                    boxes[i].style.borderColor = "#b59f3b";
                    boxes[i].style.color = "black";
                    tempSecret[tempSecret.indexOf(guessWord[i])] = null;
                    guessResult[i] = 'yellow';
                } else {
                    boxes[i].style.backgroundColor = "#333";
                    boxes[i].style.borderColor = "#333";
                    guessResult[i] = 'gray';
                }
            }
        }
    }

    function updateKeyboardColors() {
        const keyButtons = keyboard.querySelectorAll('button.key');
        keyButtons.forEach(btn => {
            const letter = btn.innerText;
            if (keyStates[letter] === 'green') {
                btn.style.backgroundColor = '#538d4e';
                btn.style.color = 'white';
                btn.style.boxShadow = '0 4px 0 #3b6337, 0 4px 6px rgba(0,0,0,0.25)';
            } else if (keyStates[letter] === 'yellow') {
                btn.style.backgroundColor = '#b59f3b';
                btn.style.color = 'white';
                btn.style.boxShadow = '0 4px 0 #8c792d, 0 4px 6px rgba(0,0,0,0.25)';
            } else if (keyStates[letter] === 'gray') {
                btn.style.backgroundColor = '#374151';
                btn.style.color = '#9ca3af';
                btn.style.boxShadow = '0 4px 0 #1f2937, 0 4px 6px rgba(0,0,0,0.25)';
            }
        });
    }

    function checkWord() {
        const state = gameState[wordLength];
        const currentDict = dictionaryMap[wordLength] || dictionaryMap[5];
        if (!currentDict.includes(state.currentInput)) {
            statusMsg.innerText = "Tidak ada di kamus!";
            statusMsg.style.color = "orange";
            const rowEl = document.getElementById('row-' + state.currentRow);
            rowEl.classList.add('shake');
            setTimeout(() => rowEl.classList.remove('shake'), 400);
            return;
        }
        statusMsg.style.color = "white";
        state.attempts--;
        document.getElementById('attempts').innerText = "Sisa: " + state.attempts;
        
        state.guesses[state.currentRow] = state.currentInput;
        applyGuessVisuals(state.currentRow, state.currentInput);

        for(let i=0; i<wordLength; i++) {
            let letter = state.currentInput[i];
            // Hitung status huruf untuk keyStates global wordLength ini
            let isGreen = state.currentInput[i] === state.secretWord[i];
            let isYellow = !isGreen && state.secretWord.includes(letter);
            
            if (isGreen) {
                keyStates[letter] = 'green';
            } else if (isYellow && keyStates[letter] !== 'green') {
                keyStates[letter] = 'yellow';
            } else if (!keyStates[letter]) {
                keyStates[letter] = 'gray';
            }
        }
        state.keyStates = keyStates;
        updateKeyboardColors();

        if (state.currentInput === state.secretWord) {
            statusMsg.innerText = "MENANG!";
            statusMsg.style.color = "#4CAF50";
            streak++; 
            saveStreak();
            updateStreakDisplay();
            state.gameOver = true;
            btnNewGame.classList.remove('hidden-btn'); 
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else if (state.attempts === 0) {
            statusMsg.innerHTML = `GAME OVER - Kata: <span style="color:white">${state.secretWord}</span>`;
            statusMsg.style.color = "#ff4444";
            streak = 0; 
            saveStreak();
            updateStreakDisplay();
            state.gameOver = true;
            btnNewGame.classList.remove('hidden-btn');
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else {
            state.currentRow++;
            state.activeBoxIndex = 0;
            const nextRow = document.getElementById('row-' + state.currentRow);
            if(nextRow) nextRow.classList.remove('hidden-row');
            state.currentInput = "";
            updateBoard();
            if (state.currentRow > 0) btnSurrender.style.visibility = 'visible';
        }
    }

    function renderKeyboard() {
        keyboard.innerHTML = "";
        const keys = [["Q","W","E","R","T","Y","U","I","O","P"], ["A","S","D","F","G","H","J","K","L"], ["DEL","Z","X","C","V","B","N","M","ENTER"]];
        keys.forEach(rowArr => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'key-row';
            rowArr.forEach(k => {
                const btn = document.createElement('button');
                btn.className = "key" + (k === "ENTER" || k === "DEL" ? " wide" : "");
                
                if (k === "DEL") {
                    btn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="#ffffff"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>';
                } else {
                    btn.innerText = k;
                }
                
                btn.onclick = () => handleInput(k);
                rowDiv.appendChild(btn);
            });
            keyboard.appendChild(rowDiv);
        });
    }

    renderKeyboard();
</script>
</body>
</html>
