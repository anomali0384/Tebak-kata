    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --menu-bg: #f5f8e8;
            --menu-text: #1a1a1a;
            --box-border: #333;
            --key-bg: #6d6d6d;
            --key-text: #ffffff;
            --key-shadow: #555555;
            --key-border: 1px solid #a8a8a8;
            --modal-bg: #1e1e1e;
            --settings-btn-bg: #2a2a2a;
            --settings-btn-border: #444;
            --settings-btn-active: #444;
            --custom-btn-bg: #2c2c2c;
            --custom-btn-color: white;
            
            /* Warna Tombol Mulai Baru & Modal - Dark Mode */
            --new-game-bg: #ffffff;
            --new-game-color: #121212;
            --modal-btn-bg: rgba(255,255,255,0.75);
            --modal-btn-color: black;

            /* Variabel Warna Tebakan - Dark Mode */
            --color-correct: #0e7c2e;
            --color-present: #D4AF37;
            --color-absent: #333;
            --text-correct: #ffffff;
            --text-present: #121212;
            --text-absent: #ffffff;
            --shadow-correct: #084c1c;
            --shadow-present: #9e7e25;
            --shadow-absent: #222;
        }

        [data-theme="light"] {
            --bg-color: #f5f8e8;
            --text-color: #1a1a1a;
            --menu-bg: #f5f8e8;
            --menu-text: #1a1a1a;
            --box-border: #d1d5db;
            --key-bg: #e5e7eb;
            --key-text: #73726f;
            --key-shadow: #9ca3af;
            --key-border: 1px solid #a8a8a8;
            --modal-bg: #f3f4f6;
            --settings-btn-bg: #e5e7eb;
            --settings-btn-border: #d1d5db;
            --settings-btn-active: #d1d5db;
            --custom-btn-bg: #2c2c2c;
            --custom-btn-color: #ffffff;
            
            /* Warna Tombol Mulai Baru & Modal - Light Mode (Hitam Teks Putih) */
            --new-game-bg: #2c2c2c;
            --new-game-color: #ffffff;
            --modal-btn-bg: #2c2c2c;
            --modal-btn-color: #ffffff;

            /* Variabel Warna Tebakan - Light Mode */
            --color-correct: #0e7c2e;
            --color-present: #D4AF37;
            --color-absent: #73726f;
            --text-correct: #ffffff;
            --text-present: #121212;
            --text-absent: #ffffff;
            --shadow-correct: #084c1c;
            --shadow-present: #9e7e25;
            --shadow-absent: #52514e;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; font-weight: bold; margin: 0; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; }

        .screen { width: 100%; height: 100dvh; display: none; flex-direction: column; align-items: center; box-sizing: border-box; }
        
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; justify-content: center; align-items: center; 
            background-color: var(--bg-color); z-index: 999; opacity: 1;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        #loading-screen.fade-out { opacity: 0; visibility: hidden; }

        .loading-logo { width: 220px; height: auto; animation: pulse 1.5s infinite alternate; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        #main-menu { font-size: 70%; display: flex; flex-direction: column; align-items: center; background-color: var(--menu-bg); color: var(--menu-text); justify-content: flex-start; padding-top: 40px; }
        #main-menu h1 { color: var(--menu-text); margin-top: 10px; margin-bottom: 20px; font-weight: 900; text-transform: none; }
        .logo-img { width: 70px; height: auto; margin-bottom: 0px; border-radius: 15px; }

        .menu-btn { padding: 9px 30px; margin: 8px; font-size: 16px; cursor: pointer; background: var(--custom-btn-bg); color: var(--custom-btn-color); border: none; border-radius: 8px; width: 250px; font-weight: 900; -webkit-tap-highlight-color: transparent; }
        .menu-btn:hover { opacity: 0.9; }
        .menu-buttons { margin-top: 0px; display: flex; flex-direction: column; align-items: center; }

        #header { width: 100%; max-width: 400px; display: grid; grid-template-columns: 80px 1fr 80px; align-items: start; margin-top: 15px; padding: 0 10px; box-sizing: border-box; }
        #controls-left { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
        #header-center { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #controls-right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
        
        #btn-menu, #btn-settings { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; -webkit-tap-highlight-color: transparent; }
        #btn-menu svg, #btn-settings svg { fill: var(--text-color); }
        #btn-surrender { background-color: #ff4444; color: white; border: none; padding: 6px 12px; font-size: 12px; font-weight: 900; border-radius: 4px; cursor: pointer; visibility: hidden; -webkit-tap-highlight-color: transparent; }
        #attempts { font-size: 14px; text-align: right; font-weight: 900; }
        #header h3 { text-align: center; margin: 0; font-size: 75%; font-weight: 900; letter-spacing: 1px; color: var(--text-color); }

        #streak-display { font-size: 9px; font-weight: 900; color: var(--text-color); margin-top: 12px; }

        #board-area { flex: 0 0 auto; height: 430px; display: flex; justify-content: center; align-items: center; overflow-x: auto; max-width: 100%; padding: 0 10px; box-sizing: border-box; }
        
        #controls-area { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 0px; width: 100%; box-sizing: border-box; justify-content: flex-end; position: relative; }
        
        #status-msg { font-size: 14px; height: 25px; text-align: center; position: absolute; bottom: 175px; width: 100%; z-index: 10; font-weight: 900; color: var(--text-color); }
        
        #btn-new-game { background: var(--new-game-bg); color: var(--new-game-color); border: none; padding: 8px 16px; font-size: 14px; font-weight: 900; cursor: pointer; border-radius: 4px; margin-bottom: 120px; z-index: 10; -webkit-tap-highlight-color: transparent; }
        .hidden-btn { display: none !important; }
        
        .grid { display: grid; grid-template-rows: repeat(8, 36px); gap: 6px; }
        .row { display: grid; gap: 4px; transition: transform 0.1s; }
        .box { 
            width: 36px; height: 36px; border: 2px solid var(--box-border); 
            display: flex; align-items: center; justify-content: center; 
            font-family: 'Arial Black', sans-serif; font-weight: 900; font-size: 18px; 
            text-transform: uppercase; border-radius: 4px; box-sizing: border-box;
            cursor: pointer; color: var(--text-color);
        }
        .box.active-box { border-color: #9ca3af; }
        .row.hidden-row { visibility: hidden; }

        .box.correct { background-color: var(--color-correct); border-color: var(--color-correct); color: var(--text-correct); }
        .box.present { background-color: var(--color-present); border-color: var(--color-present); color: var(--text-present); }
        .box.absent  { background-color: var(--color-absent); border-color: var(--color-absent); color: var(--text-absent); }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.4s; }

        .keyboard { 
            display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 410px; 
            padding: 5px 8px 12px 8px; box-sizing: border-box; position: absolute; bottom: 0; 
            background-color: transparent; z-index: 5; 
        }
        .key-row { display: flex; justify-content: center; gap: 5px; }
        
        button.key { 
            padding: 14px 4px; background: var(--key-bg); color: var(--key-text); 
            border: var(--key-border); border-radius: 6px; flex: 1; font-weight: 900; font-size: 16px; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 0 var(--key-shadow), 0 4px 6px rgba(0,0,0,0.25); 
            cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; outline: none;
        }
        button.key:focus { outline: none; }
        button.wide { flex: 1.6; font-size: 12px; }

        button.key.correct { background-color: var(--color-correct); border-color: var(--color-correct); color: var(--text-correct); box-shadow: 0 4px 0 var(--shadow-correct), 0 4px 6px rgba(0,0,0,0.25); }
        button.key.present { background-color: var(--color-present); border-color: var(--color-present); color: var(--text-present); box-shadow: 0 4px 0 var(--shadow-present), 0 4px 6px rgba(0,0,0,0.25); }
        button.key.absent  { background-color: var(--color-absent); border-color: var(--color-absent); color: var(--text-absent); box-shadow: 0 4px 0 var(--shadow-absent), 0 4px 6px rgba(0,0,0,0.25); }

        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-box { background: var(--modal-bg); border: 1px solid var(--box-border); padding: 20px; border-radius: 12px; text-align: center; width: 80%; max-width: 300px; font-weight: 900; color: var(--text-color); }
        .modal-buttons { display: flex; justify-content: space-between; margin-top: 20px; gap: 10px; }
        .btn-modal { background: var(--modal-btn-bg); color: var(--modal-btn-color); border: none; padding: 8px 15px; border-radius: 5px; font-weight: 900; font-size: 14px; cursor: pointer; flex: 1; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s; }
        .settings-title { font-size: 14px; color: var(--text-color); opacity: 0.7; margin: 15px 0 8px 0; font-weight: 900; text-align: left; }
        .settings-btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: var(--settings-btn-bg); border: 1px solid var(--settings-btn-border); color: var(--text-color); border-radius: 6px; cursor: pointer; font-size: 14px; text-align: center; font-weight: 900; -webkit-tap-highlight-color: transparent; }
        .settings-btn.active { background: var(--settings-btn-active); border-color: var(--text-color); font-weight: 900; }
        .num-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 15px; }
        .num-btn { flex: 1; padding: 8px 0; background: var(--settings-btn-bg); border: 1px solid var(--settings-btn-border); color: var(--text-color); border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 900; -webkit-tap-highlight-color: transparent; }
        .num-btn.active { background: var(--settings-btn-active); border-color: var(--text-color); }
        .btn-close-settings { margin-top: 10px; background: var(--text-color); color: var(--bg-color); border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 900; width: 100%; -webkit-tap-highlight-color: transparent; }
    </style>

</div>

        <div class="settings-title">Pilih Jumlah Huruf</div>

            <button class="num-btn" onclick="changeLength(this, 6)">6</button>
            <button class="num-btn" onclick="changeLength(this, 7)">7</button>
            <button class="num-btn" onclick="changeLength(this, 8)">8</button>
            <button class="num-btn" onclick="changeLength(this, 9)">9</button>
        </div>
        <button class="btn-close-settings" onclick="toggleSettings(false)">Tutup</button>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('fade-out');
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 800);
        }, 1500);

        loadStreak();
        history.replaceState({ screen: 'menu' }, '');
    });

    window.addEventListener('popstate', (event) => {
        const settingsOverlay = document.getElementById('settings-overlay');
        const modalOverlay = document.getElementById('modal-overlay');

        if (modalOverlay.style.display === 'flex') {
            toggleModal(false);
            history.pushState({ screen: 'game' }, '');
        } else if (settingsOverlay.style.display === 'flex') {
            toggleSettings(false);
            history.pushState({ screen: 'game' }, '');
        } else if (document.getElementById('game-katla').style.display === 'flex') {
            goBackToMenu();
        } else {
            history.replaceState({ screen: 'menu' }, '');
        }
    });

        wordLength = length;
        loadStreak();
        
        if (!gameState[wordLength]) {
            initGameData();
        } else {
            restoreGameData();
        }
    }

    function initGameData() {
        const currentDict = dictionaryMap[wordLength] || dictionaryMap[5];
        gameState[wordLength] = {
            secretWord: currentDict[Math.floor(Math.random() * currentDict.length)],
            attempts: 8,
            currentRow: 0,
            currentInput: "",
            activeBoxIndex: 0,
            gameOver: false,
            guesses: [], 
            keyStates: {}
        };
        restoreGameData();
    }

    function restoreGameData() {
        const state = gameState[wordLength];
        document.getElementById('attempts').innerText = "Sisa: " + state.attempts;
        statusMsg.innerText = "";
        board.innerHTML = "";
        
        if (state.gameOver) {
            btnNewGame.classList.remove('hidden-btn');
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else {
            btnNewGame.classList.add('hidden-btn');
            btnSurrender.style.visibility = state.currentRow > 0 ? 'visible' : 'hidden';
            keyboard.style.display = 'flex';
        }
        
        keyStates = state.keyStates;
        updateStreakDisplay();
        renderKeyboard();
        
        for (let i = 0; i < 8; i++) {
            const row = document.createElement('div');
            row.className = 'row' + (i <= state.currentRow && (!state.gameOver || i < state.attempts || state.guesses[i]) ? '' : (i === state.currentRow ? '' : ' hidden-row'));
            if (i > state.currentRow && i !== state.currentRow) {
                row.className = 'row hidden-row';
            }
            row.id = 'row-' + i;
            row.style.gridTemplateColumns = `repeat(${wordLength}, 36px)`;
            
            for (let j = 0; j < wordLength; j++) {
                const box = document.createElement('div');
                box.className = 'box';
                const boxIndex = j;
                box.onclick = () => {
                    if (state.gameOver || i !== state.currentRow) return;
                    state.activeBoxIndex = boxIndex;
                    updateBoard();
                };
                row.appendChild(box);
            }
            board.appendChild(row);
        }

        for (let i = 0; i < state.guesses.length; i++) {
            if (state.guesses[i]) {
                applyGuessVisuals(i, state.guesses[i]);
            }
        }
        updateBoard();
    }

    function toggleModal(show) { 
        modal.style.display = show ? 'flex' : 'none'; 
        if (show) history.pushState({ screen: 'modal' }, '');
    }

    function confirmSurrender() {
        toggleModal(false);
        const state = gameState[wordLength];
        statusMsg.innerHTML = `<span style="color:#ff4444;">menyerah</span> <span style="color:#ffffff;">jawabannya : ${state.secretWord.toLowerCase()}</span>`;
        streak = 0; 
        saveStreak();
        updateStreakDisplay(); 
        state.gameOver = true;
        btnNewGame.classList.remove('hidden-btn');
        btnSurrender.style.visibility = 'hidden';
        keyboard.style.display = 'none';
    }

    function resetGame() { 
        gameState[wordLength] = null;
        initGameData(); 
    }

    function handleInput(key) {
        const state = gameState[wordLength];
        if (state.gameOver) return;
        
        let inputArray = state.currentInput.padEnd(wordLength, ' ').split('');

        if (key === "ENTER") {
            if (state.currentInput.trim().length === wordLength && state.currentInput.length === wordLength) {
                checkWord();
            } else {
                statusMsg.style.color = "#ffffff";
                statusMsg.innerText = `Harus ${wordLength} huruf!`;
            }
        } else if (key === "DEL") {
            if (inputArray[state.activeBoxIndex] !== ' ') {
                inputArray[state.activeBoxIndex] = ' ';
            } else if (state.activeBoxIndex > 0) {
                state.activeBoxIndex--;
                inputArray[state.activeBoxIndex] = ' ';
            }
            state.currentInput = inputArray.join('').trimEnd();
            statusMsg.innerText = "";
            updateBoard();
        } else {
            inputArray[state.activeBoxIndex] = key;
            state.currentInput = inputArray.join('').replace(/\s+$/, '');
            if (state.activeBoxIndex < wordLength - 1) {
                state.activeBoxIndex++;
            }
            statusMsg.innerText = "";
            updateBoard();
        }
    }

    function updateBoard() {
        const state = gameState[wordLength];
        const rowEl = document.getElementById('row-' + state.currentRow);
        if (!rowEl) return;
        const boxes = rowEl.querySelectorAll('.box');
        
        for (let i = 0; i < wordLength; i++) {
            boxes[i].innerText = state.currentInput[i] || "";
            if (i === state.activeBoxIndex && !state.gameOver) {
                boxes[i].classList.add('active-box');
            } else {
                boxes[i].classList.remove('active-box');
            }
        }
    }

    function applyGuessVisuals(rowIndex, guessWord) {
        const state = gameState[wordLength];
        const rowEl = document.getElementById('row-' + rowIndex);
        if (!rowEl) return;
        const boxes = rowEl.querySelectorAll('.box');
        let tempSecret = state.secretWord.split('');
        let guessResult = Array(wordLength).fill('absent'); 
        
        for(let i=0; i<wordLength; i++) {
            boxes[i].classList.remove('correct', 'present', 'absent');
        }

        for(let i=0; i<wordLength; i++) {
            boxes[i].innerText = guessWord[i];
            if(guessWord[i] === state.secretWord[i]) {
                boxes[i].classList.add('correct');
                tempSecret[i] = null;
                guessResult[i] = 'correct';
            }
        }

        for(let i=0; i<wordLength; i++) {
            if(guessResult[i] !== 'correct') {
                if(tempSecret.includes(guessWord[i])) {
                    boxes[i].classList.add('present');
                    tempSecret[tempSecret.indexOf(guessWord[i])] = null;
                    guessResult[i] = 'present';
                } else {
                    boxes[i].classList.add('absent');
                }
            }
        }
    }

    function updateKeyboardColors() {
        const keyButtons = keyboard.querySelectorAll('button.key');
        
        keyButtons.forEach(btn => {
            const letter = btn.innerText;
            btn.classList.remove('correct', 'present', 'absent');
            
            if (keyStates[letter] === 'green') {
                btn.classList.add('correct');
            } else if (keyStates[letter] === 'yellow') {
                btn.classList.add('present');
            } else if (keyStates[letter] === 'gray') {
                btn.classList.add('absent');
            }
        });
    }

    function checkWord() {
        const state = gameState[wordLength];
        const currentDict = dictionaryMap[wordLength] || dictionaryMap[5];
        if (!currentDict.includes(state.currentInput)) {
            statusMsg.style.color = "orange";
            statusMsg.innerText = "Tidak ada di kamus!";
            const rowEl = document.getElementById('row-' + state.currentRow);
            rowEl.classList.add('shake');
            setTimeout(() => rowEl.classList.remove('shake'), 400);
            return;
        }
        state.attempts--;
        document.getElementById('attempts').innerText = "Sisa: " + state.attempts;
        
        state.guesses[state.currentRow] = state.currentInput;
        applyGuessVisuals(state.currentRow, state.currentInput);

        for(let i=0; i<wordLength; i++) {
            let letter = state.currentInput[i];
            let isGreen = state.currentInput[i] === state.secretWord[i];
            let isYellow = !isGreen && state.secretWord.includes(letter);
            
            if (isGreen) {
                keyStates[letter] = 'green';
            } else if (isYellow && keyStates[letter] !== 'green') {
                keyStates[letter] = 'yellow';
            } else if (!keyStates[letter]) {
                keyStates[letter] = 'gray';
            }
        }
        state.keyStates = keyStates;
        updateKeyboardColors();

        if (state.currentInput === state.secretWord) {
            statusMsg.style.color = "var(--text-color)";
            statusMsg.innerText = "menang!";
            streak++; 
            saveStreak();
            updateStreakDisplay();
            state.gameOver = true;
            btnNewGame.classList.remove('hidden-btn'); 
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else if (state.attempts === 0) {
            statusMsg.innerHTML = `<span style="color:#ff4444;">game over</span> <span style="color:#ffffff;">jawabannya : ${state.secretWord.toLowerCase()}</span>`;
            streak = 0; 
            saveStreak();
            updateStreakDisplay();
            state.gameOver = true;
            btnNewGame.classList.remove('hidden-btn');
            btnSurrender.style.visibility = 'hidden';
            keyboard.style.display = 'none';
        } else {
            state.currentRow++;
            state.activeBoxIndex = 0;
            const nextRow = document.getElementById('row-' + state.currentRow);
            if(nextRow) nextRow.classList.remove('hidden-row');
            state.currentInput = "";
            updateBoard();
            if (state.currentRow > 0) btnSurrender.style.visibility = 'visible';
        }
    }

    function renderKeyboard() {
        keyboard.innerHTML = "";
        const keys = [
            ["Q","W","E","R","T","Y","U","I","O","P"], 
            ["A","S","D","F","G","H","J","K","L"], 
            ["DEL","Z","X","C","V","B","N","M","ENTER"]
        ];
        
        keys.forEach(rowArr => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'key-row';
            rowArr.forEach(k => {
                const btn = document.createElement('button');
                btn.className = "key" + (k === "ENTER" || k === "DEL" ? " wide" : "");
                btn.innerText = k;
                
                // Event listener saat tombol diklik
                btn.onclick = () => handleInput(k);
                
                // Terapkan class warna jika huruf tersebut sudah ditebak sebelumnya
                if (keyStates[k] === 'green') btn.classList.add('correct');
                else if (keyStates[k] === 'yellow') btn.classList.add('present');
                else if (keyStates[k] === 'gray') btn.classList.add('absent');
                
                rowDiv.appendChild(btn);
            });
            keyboard.appendChild(rowDiv);
        });
    }
</script>
</body>
